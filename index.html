
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTTO MASTER ONLINE</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Sarabun',sans-serif;background:#f0fdf4}
.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #14532d12}
.btn{background:#15803d;color:white;padding:12px 16px;border-radius:10px;font-weight:600}
.btn2{background:#dcfce7;color:#166534;padding:10px 14px;border-radius:10px}
.field{width:100%;padding:12px;border:1px solid #bbf7d0;border-radius:10px;margin:7px 0;outline:none}
.field:focus{border-color:#16a34a}
.hidden{display:none}
</style>
</head>
<body class="p-4">

<header class="max-w-5xl mx-auto mb-5 flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-bold text-green-800">LOTTO MASTER</h1>
    <p class="text-sm text-green-600">ระบบจัดการสมาชิกออนไลน์</p>
  </div>
  <span class="text-2xl">🌿</span>
</header>

<main class="max-w-5xl mx-auto">

<!-- LOGIN -->
<section id="authPanel" class="panel max-w-md mx-auto">
  <h2 class="text-xl font-bold text-green-800 mb-3">เข้าสู่ระบบ</h2>
  <input id="email" type="email" placeholder="อีเมล" class="field">
  <input id="password" type="password" placeholder="รหัสผ่าน" class="field">
  <button onclick="login()" class="btn w-full mt-2">เข้าสู่ระบบ</button>
  <div class="text-center my-4 text-gray-400">หรือสมัครสมาชิกใหม่</div>
  <input id="regName" placeholder="ชื่อสมาชิก" class="field">
  <input id="regEmail" type="email" placeholder="อีเมลสำหรับสมัคร" class="field">
  <input id="regPassword" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" class="field">
  <button onclick="register()" class="btn2 w-full mt-2">สมัครสมาชิก</button>
  <button onclick="resetPassword()" class="text-green-700 text-sm mt-4 w-full">ลืมรหัสผ่าน?</button>
  <p id="authMessage" class="text-sm text-red-600 mt-3"></p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">
  <div class="panel flex justify-between items-center mb-4">
    <div>
      <p class="text-sm text-gray-500">ยินดีต้อนรับ</p>
      <h2 id="welcome" class="text-xl font-bold text-green-800"></h2>
      <p id="roleLabel" class="text-sm text-green-600"></p>
    </div>
    <button onclick="logout()" class="btn2">ออกจากระบบ</button>
  </div>

  <!-- MEMBER -->
  <div id="memberPanel" class="hidden panel">
    <h2 class="text-xl font-bold text-green-800">หน้าสมาชิก</h2>
    <p class="text-gray-600 mt-2">คุณเข้าสู่ระบบสมาชิกเรียบร้อยแล้ว</p>
    <div class="bg-green-50 rounded-xl p-4 mt-4">
      <p class="text-green-800 font-semibold">สถานะบัญชี</p>
      <p id="memberStatus" class="text-green-700 mt-1"></p>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="adminPanel" class="hidden">
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="panel">
        <p class="text-gray-500 text-sm">สมาชิกทั้งหมด</p>
        <p id="totalMembers" class="text-3xl font-bold text-green-700">0</p>
      </div>
      <div class="panel">
        <p class="text-gray-500 text-sm">สมาชิกใช้งาน</p>
        <p id="activeMembers" class="text-3xl font-bold text-green-700">0</p>
      </div>
    </div>

    <div class="panel">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-green-800">จัดการสมาชิก</h2>
        <button onclick="loadMembers()" class="btn2">รีเฟรช</button>
      </div>
      <div id="memberList" class="space-y-3">
        กำลังโหลดข้อมูล...
      </div>
    </div>
  </div>
</section>

</main>

<footer class="text-center text-xs text-green-700 mt-8 mb-4">
LOTTO MASTER ONLINE · MEMBER MANAGEMENT
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBld7yPcmsp0snWTdCxj5D3hC0TOlYM88g",
  authDomain: "lotto-online-eb0cf.firebaseapp.com",
  databaseURL: "https://lotto-online-eb0cf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lotto-online-eb0cf",
  storageBucket: "lotto-online-eb0cf.firebasestorage.app",
  messagingSenderId: "687853136586",
  appId: "1:687853136586:web:79514948f01f527dece233",
  measurementId: "G-F830GMM3ZG"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentProfile = null;

function message(text){
  document.getElementById("authMessage").textContent = text;
}

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}

async function register(){
  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  if(!name || !email || password.length < 6){
    message("กรุณากรอกข้อมูลให้ครบ และรหัสผ่านอย่างน้อย 6 ตัว");
    return;
  }

  try{
    const result = await auth.createUserWithEmailAndPassword(email,password);
    await db.ref("users/"+result.user.uid).set({
      name:name,
      email:result.user.email,
      role:"member",
      status:"active",
      createdAt:Date.now()
    });
    message("สมัครสมาชิกสำเร็จ");
  }catch(error){
    message(error.message);
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{
    await auth.signInWithEmailAndPassword(email,password);
    message("");
  }catch(error){
    message("เข้าสู่ระบบไม่สำเร็จ: "+error.message);
  }
}

async function resetPassword(){
  const email = document.getElementById("email").value.trim();
  if(!email){
    message("กรุณากรอกอีเมลก่อน");
    return;
  }
  try{
    await auth.sendPasswordResetEmail(email);
    message("ส่งลิงก์รีเซ็ตรหัสผ่านแล้ว");
  }catch(error){
    message(error.message);
  }
}

async function logout(){
  await auth.signOut();
}

auth.onAuthStateChanged(async user=>{
  currentUser = user;
  if(!user){
    hide("dashboard");
    show("authPanel");
    return;
  }

  try{
    const snap = await db.ref("users/"+user.uid).once("value");
    if(!snap.exists()){
      await auth.signOut();
      message("ไม่พบข้อมูลสมาชิก กรุณาติดต่อผู้ดูแลระบบ");
      return;
    }

    currentProfile = snap.val();

    if(currentProfile.status !== "active"){
      await auth.signOut();
      message("บัญชีนี้ถูกระงับการใช้งาน");
      return;
    }

    hide("authPanel");
    show("dashboard");

    document.getElementById("welcome").textContent =
      currentProfile.name || user.email;

    document.getElementById("roleLabel").textContent =
      currentProfile.role === "admin" ? "ผู้ดูแลระบบ" : "สมาชิก";

    if(currentProfile.role === "admin"){
      show("adminPanel");
      hide("memberPanel");
      loadMembers();
    }else{
      hide("adminPanel");
      show("memberPanel");
      document.getElementById("memberStatus").textContent =
        "ใช้งานได้ปกติ";
    }
  }catch(error){
    message("โหลดข้อมูลไม่สำเร็จ: "+error.message);
  }
});

async function loadMembers(){
  const list = document.getElementById("memberList");
  list.innerHTML = "กำลังโหลดข้อมูล...";

  try{
    const snap = await db.ref("users").once("value");
    const data = snap.val() || {};
    const users = Object.entries(data);

    document.getElementById("totalMembers").textContent = users.length;
    document.getElementById("activeMembers").textContent =
      users.filter(([uid,u])=>u.status==="active").length;

    if(users.length===0){
      list.innerHTML = "ยังไม่มีสมาชิก";
      return;
    }

    list.innerHTML = "";

    users.forEach(([uid,u])=>{
      const card = document.createElement("div");
      card.className = "border border-green-100 rounded-xl p-3";

      const info = document.createElement("div");
      info.className = "font-semibold text-green-900";
      info.textContent = u.name || "ไม่ระบุชื่อ";

      const email = document.createElement("div");
      email.className = "text-sm text-gray-500";
      email.textContent = u.email || "";

      const status = document.createElement("div");
      status.className = "text-sm mt-1";
      status.textContent = "สถานะ: "+(u.status || "ไม่ระบุ");

      card.append(info,email,status);

      if(uid !== currentUser.uid && u.role !== "admin"){
        const button = document.createElement("button");
        button.className = "btn2 mt-3 text-sm";
        button.textContent =
          u.status === "active" ? "ระงับสมาชิก" : "เปิดใช้งาน";

        button.onclick = ()=>changeStatus(uid,
          u.status === "active" ? "suspended" : "active");

        card.append(button);
      }

      list.append(card);
    });
  }catch(error){
    list.textContent = "ไม่สามารถโหลดข้อมูลได้: "+error.message;
  }
}

async function changeStatus(uid,status){
  if(!currentProfile || currentProfile.role !== "admin") return;

  if(!confirm("ยืนยันการเปลี่ยนสถานะสมาชิก?")) return;

  try{
    await db.ref("users/"+uid+"/status").set(status);
    loadMembers();
  }catch(error){
    alert("แก้ไขไม่สำเร็จ: "+error.message);
  }
}
</script>
</body>
</html>
