<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Master Pro Online - ระบบส่งโพยและตรวจรางวัลเรียลไทม์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat for single-file HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold shadow">
                    <i class="fa-solid fa-satellite-dish text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold text-amber-400 leading-tight">LOTTO MASTER ONLINE</h1>
                        <span id="connectionBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 font-semibold">กำลังเชื่อมต่อ...</span>
                    </div>
                    <p class="text-xs text-slate-400">ระบบส่งโพยออนไลน์ & ตรวจหวยเรียลไทม์</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="adminToggleBtn" onclick="toggleAdminMode()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg border border-slate-600 flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-lock text-amber-400"></i> <span id="adminBtnText">โหมดแอดมิน</span>
                </button>
                <button onclick="exportData()" class="admin-only hidden bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg border border-slate-600 flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-download text-emerald-400"></i> สำรอง
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">

        <!-- 1. ห้องออนไลน์ & แชร์ลิงก์ให้คนส่งโพย -->
        <section class="bg-slate-800 p-4 rounded-xl border border-sky-700/60 shadow-md space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="text-sm font-bold text-sky-400 flex items-center gap-2">
                    <i class="fa-solid fa-globe"></i> ห้องออนไลน์ (ซิงค์ข้อมูลอัตโนมัติ)
                </h2>
                <button onclick="copyShareLink()" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
                    <i class="fa-solid fa-share-nodes"></i> คัดลอกลิงก์ให้คนส่งโพย
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">รหัสห้อง (Room ID)</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="roomIdInput" value="lotto-main" placeholder="เช่น lotto16" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-sky-300 focus:outline-none focus:border-sky-500">
                        <button onclick="changeRoom()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 rounded-lg border border-slate-600 font-semibold">เข้าห้อง</button>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">ประเภทหวย</label>
                    <select id="lottoType" onchange="saveMeta()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="หวยรัฐบาลไทย">หวยรัฐบาลไทย</option>
                        <option value="หวยลาวพัฒนา">หวยลาวพัฒนา</option>
                        <option value="หวยฮานอย">หวยฮานอย</option>
                        <option value="หวยหุ้น / อื่นๆ">หวยหุ้น / อื่นๆ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">งวดประจำวันที่</label>
                    <input type="text" id="lottoDate" onchange="saveMeta()" placeholder="เช่น 16 พ.ย. 2026" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:
